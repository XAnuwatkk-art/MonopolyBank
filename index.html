<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monopoly Bank</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <header class="header">
        <div class="logo">🎩 MONOPOLY</div>
        <div class="bank-title">BANK</div>
    </header>

    <section class="player-card">
        <div>
            <div id="playerName" class="player-name">PLAYER 01</div>
            <div id="playerId" class="player-id">P01</div>
        </div>
    </section>

    <section class="balance-card">
        <div class="balance-label">ยอดเงินคงเหลือ</div>
        <div id="balance" class="balance">฿15,000</div>
    </section>

    <section class="money-section" style="background: #fff3e0; border: 2px solid #ffe0b2;">
        <h2 style="color: #e65100; font-size: 16px; margin-bottom: 10px;">👥 ยอดเงินผู้เล่นทั้งหมด</h2>
        <div id="allPlayersOverview" style="display: flex; flex-direction: column; gap: 8px;"></div>
    </section>

    <section class="money-section" style="background: #e8f5e9; border: 2px solid #a5d6a7;">
        <h2 style="color: #1b5e20;">💸 โอนเงินให้ผู้เล่นอื่น</h2>
        <div style="margin-bottom: 10px;">
            <label style="font-size: 14px; font-weight: bold; color: #333; display: block; margin-bottom: 5px;">เลือกผู้รับ:</label>
            <select id="transferTarget" style="width: 100%; height: 45px; border-radius: 10px; border: 1px solid #ccc; padding: 0 10px; font-size: 16px; background: white; touch-action: manipulation;">
                <option value="P01">PLAYER 01</option>
                <option value="P02">PLAYER 02</option>
                <option value="P03">PLAYER 03</option>
                <option value="P04">PLAYER 04</option>
            </select>
        </div>
        <div style="margin-bottom: 12px;">
            <input id="transferAmount" type="number" inputmode="numeric" min="1" placeholder="จำนวนเงินที่ต้องการโอน" style="width: 100%; height: 45px; border: 1px solid #ccc; border-radius: 10px; padding: 0 12px; font-size: 16px; outline: none; background: white; touch-action: manipulation;">
        </div>
        <button id="transferButton" type="button" style="width: 100%; background: #2e7d32; color: white; border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer; touch-action: manipulation;">
            📤 ยืนยันการโอนเงิน
        </button>
    </section>

    <section class="money-section">
        <h2>เพิ่มเงิน</h2>
        <div class="button-grid">
            <button id="add100" type="button" class="money-button add">+ ฿100</button>
            <button id="add500" type="button" class="money-button add">+ ฿500</button>
            <button id="add1000" type="button" class="money-button add">+ ฿1,000</button>
        </div>
    </section>

    <section class="money-section">
        <h2>หักเงิน</h2>
        <div class="button-grid">
            <button id="subtract100" type="button" class="money-button subtract">− ฿100</button>
            <button id="subtract500" type="button" class="money-button subtract">− ฿500</button>
            <button id="subtract1000" type="button" class="money-button subtract">− ฿1,000</button>
        </div>
    </section>

    <section class="custom-section">
        <h2>จำนวนเงินอื่น ๆ</h2>
        <input id="customAmount" type="number" inputmode="numeric" min="1" placeholder="ใส่จำนวนเงิน">
        <div class="custom-buttons">
            <button id="addCustom" type="button" class="custom-button add">+ เพิ่มเงิน</button>
            <button id="subtractCustom" type="button" class="custom-button subtract">− หักเงิน</button>
        </div>
    </section>

    <section class="reset-section">
        <button id="resetButton" type="button" class="reset-button">🔄 RESET</button>
    </section>

    <section class="history-section">
        <h2>ประวัติรายการ</h2>
        <div id="history" class="history">
            <div class="empty-history">ยังไม่มีรายการ</div>
        </div>
    </section>

    <footer class="footer">MONOPOLY BANK SYSTEM</footer>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script src="app.js"></script>
</body>
</html>
